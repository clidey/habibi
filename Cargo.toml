[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/clidey/habibi"
rust-version = "1.98"

# Shared versions. Every crate depends on these with `{ workspace = true }` so
# the whole app moves together. Each was checked with deptrust before pinning.
[workspace.dependencies]
habibi-core = { path = "crates/habibi-core" }
habibi-platform = { path = "crates/habibi-platform" }
habibi-local = { path = "crates/habibi-local" }
habibi-agent = { path = "crates/habibi-agent" }
habibi-mail = { path = "crates/habibi-mail" }
habibi-files = { path = "crates/habibi-files" }
habibi-calendar = { path = "crates/habibi-calendar" }
habibi-integrations = { path = "crates/habibi-integrations" }
habibi-server = { path = "crates/habibi-server" }

anyhow = "1"
async-trait = "0.1.92"
form_urlencoded = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.29.2", features = ["v4"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
keyring = "4.2.0"
# 0.40.2 and 0.40.3 were published the day before this was pinned; deptrust
# flags brand-new releases, so stay on the vetted 0.40.1 until they age.
sysinfo = "=0.40.1"
image = "0.25.10"
lopdf = "0.47.0"
dirs = "7"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
