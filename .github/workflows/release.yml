  publish-release:
    name: Create tag and publish release
    needs: [calculate-version, build-sign-release, build-sign-release-no-openwa]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # All three DMGs (arm64, x64, and the no-WhatsApp-bundle build) must exist
      # before the tag is created — gh creates it from the current
      # default-branch commit, so a failed build on any of them never leaves a
      # tag with an incomplete release behind it (the needs: list above already
      # blocks this job on both upstream jobs, matrix included).
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: habibi-dmg-*
          path: build
          merge-multiple: true

      - name: Create tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.calculate-version.outputs.version }}
        run: |
          gh release create "$TAG" \
            --title "Habibi $TAG" \
            --generate-notes \
            --latest \
            build/*.dmg
