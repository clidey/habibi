name: Release

# Calculates the next version from existing tags, builds Habibi for macOS,
# Windows and Linux plus the on-demand WhatsApp component for each, signs what
# can be signed, then creates the tag and GitHub release together and marks it
# "Latest". Manual only: this bumps a public version and publishes a release
# every time it runs, so nothing here fires automatically on a push.
#
# What it publishes (vX.Y.Z):
#   Habibi-universal-X.Y.Z.dmg              macOS 13+, arm64 + x86_64, Developer ID
#                                            signed (hardened runtime), notarized,
#                                            stapled
#   Habibi-universal-X.Y.Z.app.tar.gz       macOS updater payload
#   Habibi_X.Y.Z_x64-setup.exe              Windows NSIS installer, also the updater
#                                            payload; Authenticode-signed only when
#                                            the Windows secrets below are set
#   Habibi_X.Y.Z_amd64.AppImage             Linux, also the updater payload
#   Habibi_X.Y.Z_amd64.deb                  Linux (Debian/Ubuntu)
#   Habibi-WhatsApp-<arm64|x64>-X.Y.Z.zip   macOS WhatsApp component: notarized, and
#                                            verified by the app against its own Team ID
#   Habibi-WhatsApp-<windows|linux>-x64-X.Y.Z.tar.gz
#                                            Windows/Linux WhatsApp component. The app
#                                            built in the same job compiles in its
#                                            SHA-256 (HABIBI_WHATSAPP_COMPONENT_SHA256)
#                                            and trusts only those exact bytes
#   latest.json                             Tauri updater feed, signed per platform
#
# The app ships no Node. Node, native/openwa-supervisor.js, OpenWA and Chrome
# for Testing live only in the WhatsApp component, which is architecture-
# specific (Chrome for Testing has no universal build) and built on matching
# hardware so its native modules and binaries can be executed as a smoke test.
#
# Repository secrets. Existing (same names as the WhoDB pipeline):
#   APPLE_CERTIFICATES_P12            base64 of the Developer ID .p12
#   APPLE_CERTIFICATES_PASSWORD       password for that .p12
#   APPLE_DEVELOPER_ID_APPLICATION    "Developer ID Application: … (TEAMID)"
#   APPLE_ID                          Apple ID used for notarization
#   APPLE_APP_PASSWORD                app-specific password for that Apple ID
#   APPLE_TEAM_ID                     developer team identifier
#   KEYCHAIN_PASSWORD                 optional; a random one is used if unset
# New:
#   TAURI_SIGNING_PRIVATE_KEY           required; signs the updater payloads
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  only if that key has a password
#   WINDOWS_CERTIFICATE                 optional; base64 of an Authenticode .pfx
#   WINDOWS_CERTIFICATE_PASSWORD        optional; its password
#
# One-time updater setup (the release refuses to run until it is done):
#   1. On a trusted machine: pnpm tauri signer generate -w ~/.tauri/habibi.key
#      Back the private key up offline. Losing it means existing installs can
#      never auto-update again; leaking it lets anyone ship them an update.
#   2. Replace "REPLACE_WITH_UPDATER_PUBLIC_KEY" in src-tauri/tauri.conf.json
#      (plugins.updater.pubkey) with the contents of ~/.tauri/habibi.key.pub
#      and commit it. The endpoint there must stay
#      https://github.com/clidey/habibi/releases/latest/download/latest.json.
#   3. Add the private key file's contents as TAURI_SIGNING_PRIVATE_KEY (and
#      its password, if any, as TAURI_SIGNING_PRIVATE_KEY_PASSWORD).
# Windows signing is optional: without WINDOWS_CERTIFICATE the installer ships
# unsigned (SmartScreen warns on first run) and the release notes say so. A
# certificate that lives on an HSM or cloud signer cannot be exported as a
# .pfx; use bundle.windows.signCommand for those instead.

on:
  workflow_dispatch:
    inputs:
      version-bump:
        description: 'Version bump'
        required: true
        type: choice
        default: 'minor'
        options:
          - 'major' # 0.1.0 -> 1.0.0
          - 'minor' # 0.1.0 -> 0.2.0
          - 'patch' # 0.1.0 -> 0.1.1
      explicit-version:
        description: 'Exact version to release (e.g. 0.5.0) — overrides version-bump'
        required: false
        type: string
        default: ''

# Only the publish job writes to the repository.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  calculate-version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Calculate next version
        id: calc
        env:
          EXPLICIT_VERSION: ${{ inputs.explicit-version }}
          BUMP_TYPE: ${{ inputs.version-bump }}
        run: |
          set -euo pipefail

          # No prior tag => start from 0.0.0, so the default minor bump below
          # lands on 0.1.0 for the very first release.
          LATEST_TAG="$(git tag --list 'v*' | sed 's/^v//' | sort -V | tail -1)"
          [[ -n "$LATEST_TAG" ]] || LATEST_TAG="0.0.0"

          if [[ -n "$EXPLICIT_VERSION" ]]; then
            [[ "$EXPLICIT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::explicit-version must look like X.Y.Z"; exit 1; }
            NEXT_VERSION="$EXPLICIT_VERSION"
          else
            IFS='.' read -r major minor patch <<< "$LATEST_TAG"
            case "$BUMP_TYPE" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::unknown version-bump: $BUMP_TYPE"; exit 1 ;;
            esac
            NEXT_VERSION="${major}.${minor}.${patch}"
          fi

          if git rev-parse "v$NEXT_VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$NEXT_VERSION already exists"
            exit 1
          fi

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Previous: $LATEST_TAG  ->  Next: $NEXT_VERSION" >> "$GITHUB_STEP_SUMMARY"

      # Fail before any build minute is spent: a release whose updater
      # payloads no installed copy can verify would strand every user on it.
      - name: Check the updater signing setup
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          pubkey="$(jq -r '.plugins.updater.pubkey // ""' src-tauri/tauri.conf.json)"
          endpoint="$(jq -r '.plugins.updater.endpoints[0] // ""' src-tauri/tauri.conf.json)"
          if [[ -z "$pubkey" || "$pubkey" == REPLACE_WITH_UPDATER_PUBLIC_KEY ]]; then
            echo "::error::plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder; see the one-time setup at the top of release.yml"
            exit 1
          fi
          [[ "$HAS_UPDATER_KEY" == true ]] \
            || { echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is not set; see the one-time setup at the top of release.yml"; exit 1; }
          [[ "$endpoint" == "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" ]] \
            || { echo "::error::the updater endpoint must be this repository's releases/latest/download/latest.json"; exit 1; }

  macos-whatsapp-component:
    name: WhatsApp component (macOS ${{ matrix.arch }})
    needs: [calculate-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      # Chrome for Testing ships no lipo'd universal binary (mac-arm64 and
      # mac-x64 are each their own ~370MB unpacked download), so the component
      # is architecture-specific. Build each on matching hardware so the signed
      # archive can be executed as a smoke test, not merely inspected.
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    env:
      VERSION: ${{ needs.calculate-version.outputs.version }}
      HABIBI_COMPONENT_ARCH: ${{ matrix.arch }}
    steps:
      # Same allowed-endpoints as WhoDB's Apple signing/notarization job
      # (_build-apple.yml), plus the hosts this job additionally needs: Node
      # (nodejs.org), OpenWA's npm install and native prebuilds
      # (registry.npmjs.org, objects/release-assets.githubusercontent.com) and
      # Chrome for Testing (storage.googleapis.com).
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            0.pool.ntp.org:123
            0.pool.ntp.org:443
            _dns.resolver.arpa:443
            ab.apple.com.akadns.net:443
            amp-api.media-lb.apple.com.akadns.net:443
            amp-api.media.apple.com:443
            api.apple-cloudkit.com:443
            api.apple-cloudkit.fe2.apple-dns.net:443
            api.github.com:443
            apple-relay.cloudflare.com:443
            apple-relay.fastly-edge.com:443
            app.posthog.com:443
            apps-mzstatic-cdn.itunes-apple.com.akadns.net:443
            apps.mzstatic.com:443
            appstoreconnect.apple.com:443
            assets-mercury.mzstatic.com:443
            bag.itunes.apple.com:443
            blob.bn9prdstrz04a.store.core.windows.net:443
            c.apple.news:443
            calendars.icloud.com:443
            cdn-h3.g.aaplimg.com:443
            cds-cdn.v.aaplimg.com:443
            cds.apple.com:443
            cf.iadsdk.apple.com:443
            configuration-lb.ls-apple.com.akadns.net:443
            configuration-row-lb.apple.com.akadns.net:443
            configuration.apple.com.akadns.net:443
            configuration.apple.com:443
            configuration.ls.apple.com:443
            device-config.pcms.apple.com:443
            dns.google:443
            dns.google:853
            e673.dsce9.akamaiedge.net:443
            experiments.apple.com:443
            fbs.smoot.apple.com:443
            fpinit.itunes.apple.com:443
            gateway.fe2.apple-dns.net:443
            gateway.icloud.com:443
            gdmf.apple.com:443
            github.com:443
            gsa.apple.com:443
            gsp-ssl.ls.apple.com:443
            gspe1-ssl.ls.apple.com:443
            help.apple.com:443
            help.origin-apple.com.akadns.net:443
            humb.apple.com:443
            iadsdk.apple.com:443
            init.itunes.apple.com:443
            int1.stepsecurity.io:443
            ipcdn-lb.apple.com.akadns.net:443
            ipcdn.apple.com:443
            mask-api.icloud.com:443
            mask-h2.icloud.com:443
            mask.icloud.com:443
            mesu-cdn.apple.com.akadns.net:443
            mesu-cdn.origin-apple.com.akadns.net:443
            mesu.apple.com:443
