            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            s.mzstatic.com:443
            sas.pcms.apple.com:443
            security.ubuntu.com:80
            setup.icloud.com:443
            sf-api-token-service.itunes.apple.com:443
            static.crates.io:443
            static.rust-lang.org:443
            stocks-data-service.apple.com:443
            stocks-edge.apple.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            swallow.apple.com:443
            swdist.apple.com:443
            swdist.g.aaplimg.com:443
            swscan-cdn.apple.com.akadns.net:443
            swscan.apple.com:443
            timestamp.apple.com:80
            updates.cdn-apple.com:443
            uploads.github.com:443
            us.i.posthog.com:443
            us.posthog.com:443
            valid.apple.com:443
            weather-edge.apple.com:443
            www.apple.com:443
            xp-cdn-lb.itunes-apple.com.akadns.net:443
            xp.apple.com:443
            xp.g.aaplimg.com:443
            xp.itunes-apple.com.akadns.net:443
            xp.v.aaplimg.com:443

      # The packaging scripts are bash; a CRLF checkout would break them.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build scripts run here; do not leave a git token in .git/config.
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the workspace Rust toolchain
        run: |
          targets=()
          if [[ "$RUNNER_OS" == macOS ]]; then targets=(--target aarch64-apple-darwin --target x86_64-apple-darwin); fi
          rustup toolchain install 1.98.0 --profile minimal --component clippy "${targets[@]}"
          rustup default 1.98.0
      - name: Install WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config file
      - run: pnpm install --frozen-lockfile

      # Never ship an artifact that fails its own checks. As in quality.yml,
      # the JS suite (which drives zsh and macOS tools) runs on macOS and the
      # Rust checks run on every OS.
      - name: Run checks
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            pnpm run check
          else
            pnpm run build:client
            pnpm run check:rust
          fi

      - name: Build WhatsApp component
        if: runner.os != 'macOS'
        env:
          HABIBI_COMPONENT_ARCH: x64
        run: bash native/build-whatsapp-component.sh

      - name: Smoke-test WhatsApp component
        if: runner.os != 'macOS'
        run: bash native/smoke-test-whatsapp-component.sh "build/Habibi-WhatsApp-${{ matrix.platform }}-x64-$VERSION.tar.gz" x64

      # The app accepts exactly the component this job just built and tested:
      # its digest is compiled in, and nothing downloaded next to the archive
      # is ever trusted.
      - name: Pin the WhatsApp component digest
        if: runner.os != 'macOS'
        run: |
          set -euo pipefail
          digest="$(sha256sum "build/Habibi-WhatsApp-${{ matrix.platform }}-x64-$VERSION.tar.gz" | cut -d' ' -f1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::could not hash the WhatsApp component"; exit 1; }
          echo "HABIBI_WHATSAPP_COMPONENT_SHA256=$digest" >> "$GITHUB_ENV"

      - name: Import Windows code-signing certificate
        id: windows-signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Output "::warning::WINDOWS_CERTIFICATE is not set: the Windows installer is UNSIGNED and SmartScreen will warn on first run."
            "Windows installer: **unsigned** (no WINDOWS_CERTIFICATE secret)." >> $env:GITHUB_STEP_SUMMARY
            # Tells the publish job to say so in the release notes.
            New-Item -ItemType Directory -Force build | Out-Null
            Set-Content -Path build/windows-unsigned.txt -Value 'unsigned'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          if (-not $cert.HasPrivateKey) { Write-Output "::error::the Windows certificate has no private key"; exit 1 }
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Stamp the release version
        env:
          THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
        run: |
          set -euo pipefail
          # CARGO_PKG_VERSION selects this release's WhatsApp component download.
          sed -i.bak -E '/^\[workspace\.package\]/,/^\[workspace\.dependencies\]/ s/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
          rm Cargo.toml.bak
          grep -qx "version = \"$VERSION\"" Cargo.toml || { echo "::error::could not stamp Cargo.toml"; exit 1; }
          # Updater artifacts stay off in tauri.conf.json so a local
          # `pnpm tauri build` works without the signing key. With a Windows
          # thumbprint, Tauri signs the app and installer with signtool
          # (sha256, timestamped; bundle.windows in tauri.conf.json).
          mkdir -p build
          node -e '
            const [version, thumbprint] = process.argv.slice(1);
            const config = { version, bundle: { createUpdaterArtifacts: true } };
            if (thumbprint) config.bundle.windows = { certificateThumbprint: thumbprint };
            require("fs").writeFileSync("build/release.conf.json", JSON.stringify(config));
          ' "$VERSION" "${THUMBPRINT:-}"

      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATES_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: ./native/import-signing-certificate.sh

      # Tauri signs the app (hardened runtime, src-tauri/entitlements.plist)
      # and then tars that signed bundle into the updater payload, so both
      # carry identical bytes. Notarization happens on the DMG below; no
      # APPLE_ID/APPLE_PASSWORD here keeps Tauri from submitting separately.
      - name: Build and sign Habibi.app
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target universal-apple-darwin --bundles app --config build/release.conf.json

      - name: Configure notarization network
        if: runner.os == 'macOS'
        run: ./native/notarization-network.sh enable

      - name: Package, notarize and staple the DMG
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./native/sign-app.sh target/universal-apple-darwin/release/bundle/macos/Habibi.app "build/Habibi-universal-$VERSION.dmg"

      - name: Smoke-test release DMG
        if: runner.os == 'macOS'
        run: ./native/smoke-test-release.sh "build/Habibi-universal-$VERSION.dmg" "$VERSION"

      - name: Collect the macOS updater payload
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bundle=target/universal-apple-darwin/release/bundle/macos
          cp "$bundle/Habibi.app.tar.gz" "build/Habibi-universal-$VERSION.app.tar.gz"
          cp "$bundle/Habibi.app.tar.gz.sig" "build/Habibi-universal-$VERSION.app.tar.gz.sig"

      - name: Build the NSIS installer
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm tauri build --bundles nsis --config build/release.conf.json
          installer="target/release/bundle/nsis/Habibi_${VERSION}_x64-setup.exe"
          cp "$installer" "$installer.sig" build/

      - name: Verify the Windows signatures
        if: runner.os == 'Windows' && steps.windows-signing.outputs.thumbprint != ''
        shell: pwsh
        run: |
          foreach ($file in @("target/release/Habibi.exe", "build/Habibi_$($env:VERSION)_x64-setup.exe")) {
            $status = (Get-AuthenticodeSignature $file).Status
            if ($status -ne 'Valid') { Write-Output "::error::$file signature is $status"; exit 1 }
          }

      - name: Build the AppImage and .deb
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm tauri build --bundles appimage,deb --config build/release.conf.json
          bundle=target/release/bundle
          cp "$bundle/appimage/Habibi_${VERSION}_amd64.AppImage" "$bundle/appimage/Habibi_${VERSION}_amd64.AppImage.sig" build/
          cp "$bundle/deb/Habibi_${VERSION}_amd64.deb" build/
          # Newer bundlers also sign the .deb, for in-place updates of deb installs.
          if [ -f "$bundle/deb/Habibi_${VERSION}_amd64.deb.sig" ]; then cp "$bundle/deb/Habibi_${VERSION}_amd64.deb.sig" build/; fi
          dpkg-deb --info "build/Habibi_${VERSION}_amd64.deb" | grep -q "Version: $VERSION"
          if dpkg-deb --contents "build/Habibi_${VERSION}_amd64.deb" | grep -E '/(node|openwa-supervisor\.js)$'; then
            echo "::error::the .deb contains Node; it belongs in the WhatsApp component"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: habibi-app-${{ matrix.platform }}
          path: |
            build/Habibi-universal-*.dmg
            build/Habibi-universal-*.app.tar.gz
            build/Habibi-universal-*.app.tar.gz.sig
            build/Habibi_*_x64-setup.exe
            build/Habibi_*_x64-setup.exe.sig
            build/windows-unsigned.txt
            build/Habibi_*_amd64.AppImage
            build/Habibi_*_amd64.AppImage.sig
            build/Habibi_*_amd64.deb
            build/Habibi_*_amd64.deb.sig
            build/Habibi-WhatsApp-*-x64-*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Restore notarization network
        if: always() && runner.os == 'macOS'
        run: ./native/notarization-network.sh disable

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

      - name: Remove the Windows code-signing certificate
        if: always() && steps.windows-signing.outputs.thumbprint != ''
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
        run: Remove-Item -Path "Cert:\CurrentUser\My\$env:THUMBPRINT" -DeleteKey -ErrorAction SilentlyContinue

  publish-release:
    name: Create tag and publish release
    needs: [calculate-version, macos-whatsapp-component, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.calculate-version.outputs.version }}
      TAG: ${{ needs.calculate-version.outputs.tag }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every app and component must exist before the tag is created — gh
      # creates it from the current default-branch commit, so a failed build
      # on any of them never leaves a tag with an incomplete release behind it
      # (the needs: list above already blocks this job on every upstream job,
      # matrix included).
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: habibi-*
          path: build
          merge-multiple: true

      # The Tauri updater feed: one signed payload per platform. macOS uses
      # one universal payload for both architectures.
      - name: Write latest.json
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          entry() { jq -n --arg url "$base/$1" --rawfile signature "build/$1.sig" '{ signature: ($signature | gsub("\\s"; "")), url: $url }'; }
          mac="$(entry "Habibi-universal-$VERSION.app.tar.gz")"
          platforms="$(jq -n \
            --argjson mac "$mac" \
            --argjson windows "$(entry "Habibi_${VERSION}_x64-setup.exe")" \
            --argjson appimage "$(entry "Habibi_${VERSION}_amd64.AppImage")" \
            '{ "darwin-aarch64": $mac, "darwin-x86_64": $mac, "windows-x86_64": $windows, "linux-x86_64": $appimage }')"
          deb="Habibi_${VERSION}_amd64.deb"
          if [ -f "build/$deb.sig" ]; then
            platforms="$(jq --argjson deb "$(entry "$deb")" '. + { "linux-x86_64-deb": $deb }' <<< "$platforms")"
          fi
          jq -n --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson platforms "$platforms" \
            '{ version: $version, notes: ("Habibi v" + $version), pub_date: $date, platforms: $platforms }' > build/latest.json
          jq . build/latest.json

      - name: Create tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=""
          if [ -f build/windows-unsigned.txt ]; then
            notes="The Windows installer in this release is not code-signed, so Windows SmartScreen may warn before it runs."
          fi
          gh release create "$TAG" \
            --title "Habibi $TAG" \
            --notes "$notes" \
            --generate-notes \
            --latest \
            "build/Habibi-universal-$VERSION.dmg" \
            "build/Habibi-universal-$VERSION.app.tar.gz" \
            "build/Habibi_${VERSION}_x64-setup.exe" \
            "build/Habibi_${VERSION}_amd64.AppImage" \
            "build/Habibi_${VERSION}_amd64.deb" \
            "build/Habibi-WhatsApp-arm64-$VERSION.zip" \
            "build/Habibi-WhatsApp-x64-$VERSION.zip" \
            "build/Habibi-WhatsApp-windows-x64-$VERSION.tar.gz" \
            "build/Habibi-WhatsApp-linux-x64-$VERSION.tar.gz" \
            build/latest.json
