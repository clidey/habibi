            ocsp.digicert.com:443
            ocsp.digicert.com:80
            ocsp.edge.digicert.com:80
            ocsp.rootca1.amazontrust.com:80
            ocsp.sectigo.com:80
            ocsp.usertrust.com:80
            ocsp2.apple.com:443
            ocsp2.g.aaplimg.com:443
            pancake.apple.com:443
            proxy.golang.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            s.mzstatic.com:443
            sas.pcms.apple.com:443
            setup.icloud.com:443
            sf-api-token-service.itunes.apple.com:443
            stocks-data-service.apple.com:443
            stocks-edge.apple.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            swallow.apple.com:443
            swdist.apple.com:443
            swdist.g.aaplimg.com:443
            swscan-cdn.apple.com.akadns.net:443
            swscan.apple.com:443
            timestamp.apple.com:80
            updates.cdn-apple.com:443
            uploads.github.com:443
            us.i.posthog.com:443
            us.posthog.com:443
            valid.apple.com:443
            weather-edge.apple.com:443
            www.apple.com:443
            xp-cdn-lb.itunes-apple.com.akadns.net:443
            xp.apple.com:443
            xp.g.aaplimg.com:443
            xp.itunes-apple.com.akadns.net:443
            xp.v.aaplimg.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs OpenWA's package scripts; do not leave a git token
          # in .git/config where that code could read it.
          persist-credentials: false
      # The component's native modules are installed by this Node, which is
      # also the exact version it ships (.nvmrc).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Stage component
        run: ./native/build-whatsapp-component.sh

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATES_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: ./native/import-signing-certificate.sh

      - name: Configure notarization network
        run: ./native/notarization-network.sh enable

      - name: Sign and notarize component
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./native/package-whatsapp-component.sh

      - name: Smoke-test signed component
        run: ./native/smoke-test-whatsapp-component.sh "build/Habibi-WhatsApp-${{ matrix.arch }}-$VERSION.zip" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: habibi-whatsapp-macos-${{ matrix.arch }}
          path: build/Habibi-WhatsApp-${{ matrix.arch }}-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Restore notarization network
        if: always()
        run: ./native/notarization-network.sh disable

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

  app:
    name: App (${{ matrix.platform }})
    needs: [calculate-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      # macOS: one universal app. Node accounted for nearly all of the Swift
      # app, so it shipped one DMG per architecture; without it a universal
      # binary costs little and one DMG and one updater payload serve both.
      # Windows and Linux: x64, the only Chrome for Testing builds there. Their
      # WhatsApp component is built in the same job so the app can pin its
      # SHA-256 at compile time.
      matrix:
        include:
          - platform: macos
            runner: macos-15
          - platform: windows
            runner: windows-2022
          # The oldest supported runner, so the AppImage runs on older glibc too.
          - platform: linux
            runner: ubuntu-22.04
    env:
      VERSION: ${{ needs.calculate-version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      # The Apple signing/notarization endpoints above plus the Rust toolchain
      # and crate hosts, and for Linux the apt mirrors for the WebKitGTK build
      # dependencies and raw.githubusercontent.com for the AppImage tooling the
      # Tauri bundler fetches. harden-runner's egress blocking is not
      # available on Windows runners.
      - name: Harden Runner
        if: runner.os != 'Windows'
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            0.pool.ntp.org:123
            0.pool.ntp.org:443
            _dns.resolver.arpa:443
            ab.apple.com.akadns.net:443
            amp-api.media-lb.apple.com.akadns.net:443
            amp-api.media.apple.com:443
            api.apple-cloudkit.com:443
            api.apple-cloudkit.fe2.apple-dns.net:443
            api.github.com:443
            app.posthog.com:443
            apple-relay.cloudflare.com:443
            apple-relay.fastly-edge.com:443
            apps-mzstatic-cdn.itunes-apple.com.akadns.net:443
            apps.mzstatic.com:443
            appstoreconnect.apple.com:443
            archive.ubuntu.com:80
            assets-mercury.mzstatic.com:443
            azure.archive.ubuntu.com:80
            bag.itunes.apple.com:443
            blob.bn9prdstrz04a.store.core.windows.net:443
            c.apple.news:443
            calendars.icloud.com:443
            cdn-h3.g.aaplimg.com:443
            cds-cdn.v.aaplimg.com:443
            cds.apple.com:443
            cf.iadsdk.apple.com:443
            configuration-lb.ls-apple.com.akadns.net:443
            configuration-row-lb.apple.com.akadns.net:443
            configuration.apple.com.akadns.net:443
            configuration.apple.com:443
            configuration.ls.apple.com:443
            crates.io:443
            device-config.pcms.apple.com:443
            dns.google:443
            dns.google:853
            e673.dsce9.akamaiedge.net:443
            experiments.apple.com:443
            fbs.smoot.apple.com:443
            fpinit.itunes.apple.com:443
            gateway.fe2.apple-dns.net:443
            gateway.icloud.com:443
            gdmf.apple.com:443
            github.com:443
            gsa.apple.com:443
            gsp-ssl.ls.apple.com:443
            gspe1-ssl.ls.apple.com:443
            help.apple.com:443
            help.origin-apple.com.akadns.net:443
            humb.apple.com:443
            iadsdk.apple.com:443
            index.crates.io:443
            init.itunes.apple.com:443
            int1.stepsecurity.io:443
            ipcdn-lb.apple.com.akadns.net:443
            ipcdn.apple.com:443
            mask-api.icloud.com:443
            mask-h2.icloud.com:443
            mask.icloud.com:443
            mesu-cdn.apple.com.akadns.net:443
            mesu-cdn.origin-apple.com.akadns.net:443
            mesu.apple.com:443
            metrics.icloud.com:443
