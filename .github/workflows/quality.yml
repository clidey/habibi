name: Quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: github.event.pull_request.draft != true
    runs-on: macos-latest
    steps:
      # Same allowed-endpoints as WhoDB's frontend build job
      # (_build-frontend.yml): a pnpm install plus GitHub API/checkout access.
      # No Apple hosts here — this job never signs or notarizes.
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs package scripts; do not leave a git token in
          # .git/config where that code could read it.
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Rust half of `pnpm run check` runs in the matrix job below.
      - run: pnpm run typecheck
      - run: pnpm run typecheck:references
      - run: pnpm test

  rust:
    if: github.event.pull_request.draft != true
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      # Same policy as the jobs above plus the Rust toolchain/crate hosts and,
      # on Ubuntu, the apt mirrors for the WebKitGTK build dependencies.
      # harden-runner's egress blocking is not available on Windows runners.
      - name: Harden Runner
        if: runner.os != 'Windows'
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            archive.ubuntu.com:80
            azure.archive.ubuntu.com:80
            security.ubuntu.com:80
            packages.microsoft.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build scripts run here; do not leave a git token in .git/config.
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the workspace Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          rustup default 1.98.0
      - name: Install WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config
      - run: pnpm install --frozen-lockfile
      # tauri-build checks the bundle resources, which include the client bundles.
      - run: pnpm run build:client
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # release.yml notarizes on exactly these runners: the universal app DMG and
  # the arm64 WhatsApp component on macos-15, the x64 component on
  # macos-15-intel. Exercise the PF workaround there on every change instead
  # of discovering a broken runner image mid-release.
  notarization-network:
    if: github.event.pull_request.draft != true
    name: Verify notarization network (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify hosted macOS notarization network workaround
        run: ./native/notarization-network.sh enable
      # The signing scripts only otherwise run during a release. The component
      # build must also parse under macOS's own bash 3.2.
      - name: Check the release scripts parse
        run: |
          for script in native/*.sh; do
            case "$(head -n 1 "$script")" in
              *zsh*) zsh -n "$script" ;;
              *) /bin/bash -n "$script" ;;
            esac
          done
      - name: Restore hosted macOS network
        if: always()
        run: ./native/notarization-network.sh disable
