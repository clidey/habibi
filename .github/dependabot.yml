# Version updates come from Renovate. Every entry has
# open-pull-requests-limit: 0, which stops Dependabot version updates while
# keeping this file (and its registries) for security updates.
version: 2
updates:
  - package-ecosystem: 'npm'
    open-pull-requests-limit: 0
    directory: '/'
    schedule:
      interval: 'weekly'
