# Supply-chain and install-time security settings, checked in so they apply on
# every machine and in CI — not just locally, where a developer's personal
# ~/.npmrc may otherwise be silently doing this work. Modeled on WhoDB's
# frontend/pnpm-workspace.yaml.
packages:
  - docs

# Reject a dependency version published within the last 7 days. A malicious
# publish is most likely to be caught and unpublished in this window; this is
# the setting that was previously only enforced by a developer's local ~/.npmrc.
minimumReleaseAge: 10080

# User-requested first-party releases; all other releases keep the age gate.
minimumReleaseAgeExclude:
  - '@clidey/ux@1.6.4'
  - '@clidey/dory@1.9.0'

# Refuses a resolution that would silently downgrade a package versus what the
# lockfile already trusted.
trustPolicy: 'no-downgrade'

# Rejects dependencies resolved through unexpected registries or protocols.
blockExoticSubdeps: true

strictDepBuilds: true
strictSsl: true
strictPeerDependencies: true
saveExact: true
auditLevel: high
verifyStoreIntegrity: true

# Only these packages may run install-time scripts. Any other dependency that
# ships one installs with it skipped, so a compromised transitive dependency
# cannot execute code during `pnpm install` merely by being present in the
# tree. Generated by `pnpm approve-builds --all` — do not hand-edit the values;
# re-run that command if a new package needs a script approved.
#
# - node-pty: compiles its native pty binding; the embedded terminal cannot
#   function without it.
# - esbuild: postinstall only downloads its own prebuilt platform binary.
# - protobufjs, @google/genai: transitive through @earendil-works/pi-ai (the
#   agent runtime habibi already depends on directly), not called by habibi
#   itself. Re-review if either stops being a dependency of pi-ai.
allowBuilds:
  '@google/genai': true
  esbuild: true
  node-pty: true
  protobufjs: true

# Dory's Babel tooling requests an older semver release without provenance.
# Use an aged, provenance-backed release for those version checks; retain the
# workspace's trust and release-age policies.
overrides:
  'semver@^6.3.1': 7.8.5
  '@clidey/dory>@clidey/ux': 1.6.4
