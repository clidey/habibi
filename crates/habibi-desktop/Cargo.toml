[package]
name = "habibi-desktop"
description = "Per-OS desktop integration for the Habibi shell that does not need Tauri: clipboard, speech, PTY, focus timer, teleprompter."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
habibi-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
image.workspace = true
portable-pty = "=0.9.0"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSArray", "NSData", "NSDictionary", "NSURL", "NSBundle", "NSGeometry", "NSObject", "NSValue", "NSEnumerator"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication", "NSBitmapImageRep", "NSImageRep"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = "=3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Foundation", "Foundation_Collections", "Media_SpeechRecognition", "Globalization", "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug"] }
windows-collections = "=0.3.2"
